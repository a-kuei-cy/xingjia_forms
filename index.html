<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>興嘉智慧表單 V2.0</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#e9f6f2;display:grid;place-items:center;min-height:90vh;color:#164d43}.card{max-width:520px;background:white;padding:32px;border-radius:20px;box-shadow:0 10px 30px #164d4322}input,button{padding:12px;border-radius:9px;font-size:16px}input{width:95%;border:1px solid #aaa}button{background:#137d68;color:white;border:0;margin-top:12px;cursor:pointer}</style></head><body><main class="card"><h1>興嘉國小｜智慧表單 V2.0</h1><p>本系統使用 Google Apps Script 安全執行表單、文件與管理作業。請輸入部署完成的 Apps Script 網頁網址。</p><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="go()">開啟智慧表單</button><p id="msg"></p></main><script>const i=document.querySelector('#url');i.value=localStorage.getItem('xingjia_gas_url')||'';function go(){let u=i.value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){document.querySelector('#msg').textContent='請輸入有效的 GAS /exec 網址';return}localStorage.setItem('xingjia_gas_url',u);location.href=u}</script></body></html>
