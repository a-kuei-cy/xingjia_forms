<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f2f8f6;font:16px system-ui,'Noto Sans TC',sans-serif;color:#193e38}header{background:#116a5a;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:20px}.panel{background:white;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 2px 12px #0001}input,select,textarea{padding:10px;border:1px solid #bdcec8;border-radius:8px;width:100%;font:inherit;margin:6px 0 14px}button{padding:10px 15px;border:0;border-radius:8px;background:#137d68;color:white;cursor:pointer;margin:4px}button.alt{background:#526f68}button.danger{background:#a44646}.tabs{display:flex;flex-wrap:wrap;gap:5px}.hidden{display:none}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left;vertical-align:top}label{font-weight:600}.scroll{overflow:auto}.muted{color:#64746e}#msg{white-space:pre-wrap;position:sticky;top:0;background:#d6f0e6;padding:10px;border-radius:7px}a{color:#087866}h2{margin-top:0}</style></head><body><header><h1>興嘉國小｜智慧表單 V2.0</h1><div>線上填報・簽核・文件範本・PDF・研習成果</div></header><main><p id="msg" class="hidden"></p><nav class="tabs"><button onclick="tab('public')">線上填報</button><button onclick="tab('admin')">管理者登入</button><button onclick="adminTab('forms')">表單管理</button><button onclick="adminTab('records')">審核與文件</button><button onclick="adminTab('templates')">文件範本</button><button onclick="adminTab('stats')">統計與成果</button></nav><section id="public" class="panel"><h2>線上填報</h2><label>選擇表單</label><select id="publicForm" onchange="renderPublic()"></select><div id="publicFields"></div><label>填報人姓名</label><input id="submitter" maxlength="100"><button onclick="sendForm()">送出表單</button></section><section id="admin" class="panel hidden"><h2>管理者登入</h2><p class="muted">密碼只送至 Apps Script 後端驗證，不寫在公開網頁。</p><input id="password" type="password" placeholder="管理者密碼"><button onclick="signIn()">登入</button><button class="alt" onclick="signOut()">登出</button></section><section id="forms" class="panel hidden"><h2>表單管理</h2><input id="formId" type="hidden"><label>表單名稱</label><input id="formName" placeholder="例如：教師研習回饋"><label>文件範本</label><select id="formTemplate"></select><label><input id="formEnabled" type="checkbox" checked style="width:auto"> 啟用表單</label><h3>欄位設計</h3><div id="fieldRows"></div><button class="alt" onclick="addField()">＋ 新增欄位</button><button onclick="saveFormUI()">儲存表單</button><button class="alt" onclick="clearForm()">新增另一張</button><h3>現有表單</h3><div id="formsList" class="scroll"></div></section><section id="records" class="panel hidden"><h2>審核與文件</h2><p>勾選已核准紀錄後，可批次產生 PDF（每批最多15筆）。</p><button onclick="batch()">批次產生 PDF</button><div id="recordList" class="scroll"></div></section><section id="templates" class="panel hidden"><h2>Google 文件範本</h2><p>在文件中使用 <code>{{姓名}}</code>、<code>{{表單名稱}}</code> 或 <code>{{欄位標題}}</code> 作為替換標記。</p><label>範本名稱</label><input id="templateName" placeholder="研習回饋成果"><label>Google 文件網址或 ID</label><input id="templateDoc"><button onclick="addTemplate()">新增範本</button><div id="templateList"></div></section><section id="stats" class="panel hidden"><h2>統計與研習成果</h2><div id="summary"></div><label>選擇研習／活動表單</label><select id="reportForm"></select><button onclick="makeReport()">產生研習成果 Google 文件及 PDF</button><h3>最近操作紀錄</h3><div id="logList"></div></section></main><script>
let token='',pub=[],state=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notice(s){$('#msg').textContent=s;$('#msg').classList.remove('hidden')}function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>{notice(e.message||String(e));reject(e)})[fn](...args))}function tab(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden')}function adminTab(id){if(!token){notice('請先登入管理者');tab('admin');return}tab(id);refresh()}async function loadPublic(){pub=await call('publicForms');$('#publicForm').innerHTML=pub.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');renderPublic()}function renderPublic(){const f=pub.find(x=>x.id===$('#publicForm').value);$('#publicFields').innerHTML=f?f.fields.map(x=>`<label>${esc(x.label)} ${x.required?'*':''}</label>${x.type==='textarea'?`<textarea data-key="${esc(x.key)}"></textarea>`:`<input data-key="${esc(x.key)}" type="${esc(x.type)}">`}`).join(''):'目前沒有開放填寫的表單'}async function sendForm(){const f=$('#publicForm').value;if(!f)return notice('尚無表單');const data={};document.querySelectorAll('#publicFields [data-key]').forEach(x=>data[x.dataset.key]=x.value);const r=await call('submitForm',f,$('#submitter').value,data);notice('送出成功！編號：'+r.id);$('#submitter').value='';renderPublic()}async function signIn(){token=await call('login',$('#password').value);$('#password').value='';notice('登入成功（6小時內有效）');adminTab('forms')}async function signOut(){if(token)await call('logout',token);token='';state=null;notice('已登出');tab('public')}async function refresh(){if(!token)return;state=await call('dashboard',token);renderAll()}function renderAll(){const opts='<option value="">不使用範本</option>'+state.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');$('#formTemplate').innerHTML=opts;$('#reportForm').innerHTML=state.forms.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');$('#formsList').innerHTML='<table><tr><th>名稱</th><th>狀態</th><th>操作</th></tr>'+state.forms.map(f=>`<tr><td>${esc(f.name)}</td><td>${f.enabled?'啟用':'停用'}</td><td><button onclick="editForm('${f.id}')">編修</button></td></tr>`).join('')+'</table>';$('#templateList').innerHTML=state.templates.map(t=>`<p>${esc(t.name)} — <a target="_blank" rel="noopener" href="https://docs.google.com/document/d/${encodeURIComponent(t.docId)}/edit">查看範本</a></p>`).join('');$('#summary').innerHTML=Object.entries(state.stats).map(([k,v])=>`<b>${({total:'總筆數',pending:'待審核',approved:'已核准',rejected:'退回'})[k]}：${v}</b>　`).join('');$('#logList').innerHTML=state.logs.map(x=>`<p>${esc(x.time)}　${esc(x.action)}　${esc(x.detail)}</p>`).join('');$('#recordList').innerHTML='<table><tr><th>選取</th><th>表單／姓名</th><th>填報內容</th><th>狀態</th><th>操作</th></tr>'+state.records.map(r=>`<tr><td><input type="checkbox" class="pick" value="${r.id}" style="width:auto" ${r.status==='已核准'?'':'disabled'}></td><td>${esc(r.formName)}<br>${esc(r.submitter)}<br><small>${esc(r.created)}</small></td><td>${Object.entries(r.payload).map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')}</td><td>${esc(r.status)}<br>${esc(r.comment)}</td><td><button onclick="reviewUI('${r.id}','已核准')">核准</button><button class="danger" onclick="reviewUI('${r.id}','退回')">退回</button><button class="alt" onclick="pdfUI('${r.id}')">PDF</button>${r.pdfUrl?`<a href="${esc(r.pdfUrl)}" target="_blank" rel="noopener">查看 PDF</a>`:''}</td></tr>`).join('')+'</table>'}function addField(v={}){const d=document.createElement('div');d.className='field';d.innerHTML=`<input class="label" placeholder="欄位名稱" value="${esc(v.label||'')}"><select class="type">${['text','textarea','date','number'].map(t=>`<option value="${t}" ${t===v.type?'selected':''}>${({text:'短文字',textarea:'長文字',date:'日期',number:'數字'})[t]}</option>`).join('')}</select><label><input type="checkbox" class="required" style="width:auto" ${v.required?'checked':''}> 必填</label><button class="danger" onclick="this.parentNode.remove()">刪除欄位</button><hr>`;$('#fieldRows').appendChild(d)}function clearForm(){$('#formId').value='';$('#formName').value='';$('#fieldRows').innerHTML='';$('#formEnabled').checked=true;addField()}function editForm(id){const f=state.forms.find(x=>x.id===id);$('#formId').value=f.id;$('#formName').value=f.name;$('#formTemplate').value=f.templateId;$('#formEnabled').checked=String(f.enabled)==='true';$('#fieldRows').innerHTML='';f.fields.forEach(addField);tab('forms')}async function saveFormUI(){const fields=[...document.querySelectorAll('.field')].map(d=>({label:d.querySelector('.label').value,type:d.querySelector('.type').value,required:d.querySelector('.required').checked}));await call('saveForm',token,{id:$('#formId').value,name:$('#formName').value,templateId:$('#formTemplate').value,enabled:$('#formEnabled').checked,fields});notice('表單已儲存');await refresh();await loadPublic()}async function addTemplate(){await call('saveTemplate',token,$('#templateName').value,$('#templateDoc').value);notice('範本已新增');await refresh()}async function reviewUI(id,status){const comment=prompt('審核備註（可留空）','');if(comment===null)return;await call('review',token,id,status,comment);notice('審核完成');await refresh()}async function pdfUI(id){const r=await call('generatePdf',token,id);notice('PDF 已產生：'+r.pdfUrl);await refresh()}async function batch(){const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return notice('請勾選已核准紀錄');const r=await call('batchPdf',token,ids);notice(`完成 ${r.filter(x=>x.ok).length} 筆；失敗 ${r.filter(x=>!x.ok).length} 筆\n`+r.filter(x=>!x.ok).map(x=>x.error).join('\n'));await refresh()}async function makeReport(){const r=await call('trainingReport',token,$('#reportForm').value);notice('成果報告已建立：'+r.pdfUrl);await refresh()}clearForm();loadPublic().catch(()=>{});
</script></body></html>
